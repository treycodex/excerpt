<!doctype html>
<!--
  The disk image window's background. Render it with ./render-background.sh, which
  writes background.png (1x) and background@2x.png; package-dmg.sh combines them.

  The icon slots are drawn to match the positions in dmg-settings.py. Finder draws
  each icon's name itself, black in light mode and white in dark mode, so every name
  sits on a bronze plate (#917137) that keeps at least 4.5:1 contrast with both.
  Move an icon in one file and you must move it in the other.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; font-weight: 400 900; src: url("../../web/public/fonts/Archivo-Variable.woff2") format("woff2-variations"); }
  @font-face { font-family: "Instrument Serif"; src: url("../../web/public/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; src: url("../../web/public/fonts/IBMPlexMono-Regular.woff2") format("woff2"); }

  :root {
    --ground: #0E0F0D; --raise: #171913; --hair: #24271E; --edge: #363A2D;
    --ink: #EDECDB; --paper: #F1F0DD; --dim: #A8AA9B; --faint: #7C7E70;
    --ember: #FF4D0F; --cap: #F7DF68; --plate: #917137;
    --sans: "Archivo", sans-serif; --serif: "Instrument Serif", serif; --mono: "IBM Plex Mono", monospace;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 720px; height: 440px; overflow: hidden; }
  body {
    position: relative; color: var(--ink); font-family: var(--sans);
    background:
      radial-gradient(420px 260px at 18% 105%, rgba(255, 77, 15, .16), transparent 70%),
      radial-gradient(520px 300px at 70% 40%, rgba(241, 240, 221, .05), transparent 70%),
      var(--ground);
  }

  /* Film edge, as on the site's frames. */
  .sprockets { position: absolute; left: 0; right: 0; height: 4px;
    background: repeating-linear-gradient(90deg, rgba(241, 240, 221, .10) 0 8px, transparent 8px 18px); }
  .sprockets.top { top: 8px; } .sprockets.bottom { bottom: 8px; }

  header { position: absolute; top: 30px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: baseline; }
  .wordmark { display: inline-flex; align-items: baseline; gap: .42em; font-size: 15px; font-weight: 600; color: var(--paper); }
  .wordmark .mark { letter-spacing: -.133em; padding-right: .133em; }
  .wordmark .word { font-size: 1.05em; letter-spacing: -.045em; }
  .meta { font: 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }

  h1 { position: absolute; top: 72px; left: 40px; font: 400 40px/1.05 var(--serif); letter-spacing: -.01em; color: var(--paper); }
  h1 em { font-style: normal; color: var(--cap); }

  /* Icon slots. Centres: Excerpt (150, 236), Applications (370, 236), Read me (600, 236). */
  .plate { position: absolute; top: 282px; height: 22px; border-radius: 11px; background: var(--plate); transform: translateX(-50%); }
  .p-app { left: 150px; width: 96px; }
  .p-apps { left: 370px; width: 124px; }
  .p-readme { left: 600px; width: 124px; }

  .arrow { position: absolute; left: 222px; top: 226px; width: 76px; height: 20px; }

  .divider { position: absolute; left: 496px; top: 170px; width: 1px; height: 170px;
    background: repeating-linear-gradient(180deg, var(--edge) 0 4px, transparent 4px 9px); }
  .aside { position: absolute; left: 520px; width: 160px; top: 162px; text-align: center;
    font: 9.5px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }

  footer { position: absolute; left: 40px; right: 40px; bottom: 30px; display: flex; justify-content: space-between;
    font: 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  footer b { font-weight: 400; color: var(--dim); }
</style>
</head>
<body>
  <div class="sprockets top"></div>
  <header>
    <span class="wordmark"><span class="mark">[ e ]</span><span class="word">excerpt</span></span>
    <span class="meta">Apple silicon · macOS 26</span>
  </header>
  <h1>Drag Excerpt into <em>Applications.</em></h1>

  <div class="plate p-app"></div>
  <svg class="arrow" viewBox="0 0 76 20" fill="none">
    <path d="M2 10H70" stroke="#FF4D0F" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"/>
    <path d="M63 3L71 10L63 17" stroke="#FF4D0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="plate p-apps"></div>

  <div class="divider"></div>
  <p class="aside">Blocked on first open?</p>
  <div class="plate p-readme"></div>

  <footer><span>Your notes stay <b>on this Mac</b></span><span>excerpt-rho.vercel.app</span></footer>
  <div class="sprockets bottom"></div>
</body>
</html>
